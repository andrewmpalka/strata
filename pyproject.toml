[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.0.0"
description = "A reproducible two-chain data platform for an observational authentication-mode study"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "integration_tests",
]
